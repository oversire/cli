# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: oversire

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: oversire
    main: ./cmd/oversire
    binary: oversire
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # TODO(windows-signing): sign oversire.exe with Authenticode. This needs a code signing
    # certificate. Add a post hook here (for example signtool or osslsigncode) when the certificate exists.

archives:
  - id: default
    name_template: "oversire_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [oversire]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

nfpms:
  - id: packages
    package_name: oversire
    file_name_template: "oversire_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids: [oversire]
    vendor: OverSire
    homepage: https://github.com/oversire/cli
    maintainer: OverSire <noreply@oversire.dev>
    description: The OverSire CLI and daemon. It serves the live agent state of the machine and does work orders.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin

release:
  github:
    owner: oversire
    name: cli
  draft: false
  prerelease: auto

changelog:
  sort: asc
